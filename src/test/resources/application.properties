# Tests run against a throwaway in-memory database (never the ./data file DB).
spring.datasource.url=jdbc:h2:mem:echotracker-test;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

# Emission factors needed by EmissionProperties binding during tests.
emission.factors.car_petrol=0.171
emission.factors.metro=0.041
emission.factors.electricity=0.820
emission.factors.veg_meal=0.700
