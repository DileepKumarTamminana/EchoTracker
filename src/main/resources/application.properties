spring.application.name=EchoTracker

# ===== H2 file-based database (persists across restarts) =====
spring.datasource.url=jdbc:h2:file:./data/echotracker
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== H2 web console: http://localhost:8080/h2-console =====
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== Thymeleaf =====
spring.thymeleaf.cache=false

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info

# ===== Server =====
server.port=8080
server.error.whitelabel.enabled=false

# ===========================================================
# Emission factors: kg CO2e emitted per single unit of activity.
# Edit these to reflect the most accurate regional values.
# Keys must match the ActivityType enum names (lower-case).
# ===========================================================
emission.factors.car_petrol=0.171
emission.factors.car_diesel=0.168
emission.factors.motorbike=0.103
emission.factors.bus=0.105
emission.factors.metro=0.041
emission.factors.train=0.035
emission.factors.flight=0.255
emission.factors.electricity=0.820
emission.factors.natural_gas=0.184
emission.factors.water=0.000344
emission.factors.lpg=2.983
emission.factors.waste=0.450
emission.factors.meat_meal=2.500
emission.factors.veg_meal=0.700
