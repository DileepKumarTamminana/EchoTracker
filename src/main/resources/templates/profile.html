<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Profile')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('profile')}"></nav>

<main class="page">
    <div class="container">
        <div class="page-head">
            <h1>Your profile</h1>
            <p>Manage your account and review your achievements.</p>
        </div>

        <div th:replace="~{fragments/layout :: flash}"></div>

        <div class="grid cols-2">
            <div class="card">
                <h3 class="card-title">Account</h3>
                <p><span class="muted">Username:</span> <strong th:text="${currentUser.username}">user</strong></p>
                <p><span class="muted">Email:</span> <strong th:text="${currentUser.email}">user@email.com</strong></p>
                <p><span class="muted">Total footprint:</span> <strong th:text="${totalAllTime} + ' kg CO₂e'">0</strong></p>
                <p><span class="muted">Badges earned:</span> <strong th:text="${earnedCount}">0</strong></p>

                <hr style="border-color:var(--border);"/>
                <h3 class="card-title">Update details</h3>
                <form th:action="@{/profile}" method="post" th:object="${profileForm}">
                    <div class="form-group">
                        <label for="fullName">Full name</label>
                        <input class="form-control" type="text" id="fullName" th:field="*{fullName}"/>
                        <div class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                    </div>
                    <div class="form-group">
                        <label for="newPassword">New password <span class="muted">(leave blank to keep current)</span></label>
                        <input class="form-control" type="password" id="newPassword" th:field="*{newPassword}"/>
                        <div class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                    </div>
                    <button class="btn btn-primary" type="submit">Save changes</button>
                </form>
            </div>

            <div class="card">
                <h3 class="card-title">Achievements</h3>
                <div class="grid cols-2">
                    <div th:each="bv : ${badges}" class="badge-tile" th:classappend="${bv.earned()} ? '' : 'locked'">
                        <span class="emoji" th:text="${bv.badge().icon}">🌱</span>
                        <div class="title" th:text="${bv.badge().title}">Badge</div>
                        <div class="desc" th:text="${bv.badge().description}">Description</div>
                        <div class="desc" th:if="${bv.earned()}" style="color:var(--brand);">Earned ✓</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
