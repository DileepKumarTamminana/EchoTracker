<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('History')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('history')}"></nav>

<main class="page">
    <div class="container">
        <div class="page-head">
            <h1>Emission history</h1>
            <p>See how your footprint trends over time.</p>
        </div>

        <div class="card">
            <form method="get" th:action="@{/history}" class="flex-between">
                <div class="form-group" style="margin:0;">
                    <label for="period">View by</label>
                    <select class="form-control" name="period" id="period" onchange="this.form.submit()">
                        <option value="day" th:selected="${period == 'day'}">Daily (last 14 days)</option>
                        <option value="week" th:selected="${period == 'week'}">Weekly (last 8 weeks)</option>
                        <option value="month" th:selected="${period == 'month'}">Monthly (last 12 months)</option>
                    </select>
                </div>
                <div class="stat" style="text-align:right;">
                    <span class="label">Total for range</span>
                    <span class="value" style="font-size:1.5rem;"><span th:text="${periodTotal}">0</span> <span class="unit">kg CO₂e</span></span>
                </div>
            </form>

            <canvas id="historyChart" class="mt-3" height="120"></canvas>
        </div>

        <div class="card mt-3">
            <h3 class="card-title">Breakdown</h3>
            <table class="table">
                <thead><tr><th>Period</th><th style="text-align:right;">CO₂e (kg)</th></tr></thead>
                <tbody>
                <tr th:each="p : ${series}">
                    <td th:text="${p.label}">Period</td>
                    <td style="text-align:right;" th:text="${p.co2Kg}">0</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

<script th:inline="javascript">
    const labels = /*[[${seriesLabels}]]*/ [];
    const values = /*[[${seriesValues}]]*/ [];
    const chart = new Chart(document.getElementById('historyChart'), {
        type: 'bar',
        data: { labels: labels, datasets: [{ label: 'kg CO₂e', data: values, backgroundColor: '#2e7d32', borderRadius: 6 }] },
        options: {
            plugins: { legend: { display: false } },
            scales: {
                y: { beginAtZero: true, ticks: { color: chartTextColor() }, grid: { color: chartGridColor() } },
                x: { ticks: { color: chartTextColor() }, grid: { display: false } }
            }
        }
    });
    document.addEventListener('themechange', function () {
        chart.options.scales.y.ticks.color = chartTextColor();
        chart.options.scales.x.ticks.color = chartTextColor();
        chart.options.scales.y.grid.color = chartGridColor();
        chart.update();
    });
</script>
</body>
</html>
