<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tips')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('suggestions')}"></nav>

<main class="page">
    <div class="container">
        <div class="page-head">
            <h1>Eco tips for you 🌱</h1>
            <p>Personalised to your biggest emission source, plus everyday wins.</p>
        </div>

        <div class="grid cols-2">
            <div class="card" th:each="s : ${suggestions}">
                <p style="margin:0;" th:text="${s}">Suggestion</p>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
