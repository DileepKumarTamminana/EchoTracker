<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create account')}"></head>
<body>
<div class="auth-wrap">
    <div class="card auth-card">
        <div class="brand"><span class="leaf">🌿</span> EchoTracker</div>
        <p class="auth-sub">Create your account</p>

        <form th:action="@{/register}" method="post" th:object="${registerForm}" onsubmit="return matchPasswords();">
            <div class="form-group">
                <label for="username">Username</label>
                <input class="form-control" type="text" id="username" th:field="*{username}" required/>
                <div class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            </div>
            <div class="form-group">
                <label for="fullName">Full name <span class="muted">(optional)</span></label>
                <input class="form-control" type="text" id="fullName" th:field="*{fullName}"/>
                <div class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input class="form-control" type="email" id="email" th:field="*{email}" required/>
                <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input class="form-control" type="password" id="password" th:field="*{password}" minlength="6" required/>
                <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>
            <div class="form-group">
                <label for="confirm">Confirm password</label>
                <input class="form-control" type="password" id="confirm" minlength="6" required/>
                <div class="field-error" id="confirmError" style="display:none;">Passwords do not match.</div>
            </div>
            <button class="btn btn-primary btn-block" type="submit">Create account</button>
        </form>

        <p class="auth-foot">Already registered? <a th:href="@{/login}">Sign in</a></p>
    </div>
</div>
<script>
    function matchPasswords() {
        var p = document.getElementById('password').value;
        var c = document.getElementById('confirm').value;
        var err = document.getElementById('confirmError');
        if (p !== c) { err.style.display = 'block'; return false; }
        err.style.display = 'none';
        return true;
    }
</script>
</body>
</html>
