<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body>
<div class="auth-wrap">
    <div class="card auth-card">
        <div class="brand"><span class="leaf">🌿</span> EchoTracker</div>
        <p class="auth-sub">Track your carbon footprint</p>

        <div th:if="${param.error}" class="alert alert-danger">Invalid username or password.</div>
        <div th:if="${param.logout}" class="alert alert-info">You have been signed out.</div>
        <div th:if="${param.registered}" class="alert alert-success">Account created — please sign in.</div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input class="form-control" type="text" id="username" name="username" autofocus required/>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input class="form-control" type="password" id="password" name="password" required/>
            </div>
            <button class="btn btn-primary btn-block" type="submit">Sign in</button>
        </form>

        <p class="auth-foot">No account? <a th:href="@{/register}">Create one</a></p>
        <p class="auth-foot muted" style="font-size:0.8rem;">Demo login — <strong>demo</strong> / <strong>demo123</strong></p>
    </div>
</div>
</body>
</html>
