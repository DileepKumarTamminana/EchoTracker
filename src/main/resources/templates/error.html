<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body>
<div class="auth-wrap">
    <div class="card auth-card text-center">
        <div class="brand" style="justify-content:center;"><span class="leaf">🌿</span> EchoTracker</div>
        <h2 style="margin:1rem 0 0.5rem;">Something went wrong</h2>
        <p class="muted">
            <span th:if="${status}" th:text="'Error ' + ${status}">Error</span>
            <span th:text="${error}"></span>
        </p>
        <p th:if="${message}" class="muted" th:text="${message}"></p>
        <a th:href="@{/dashboard}" class="btn btn-primary mt-2">Back to dashboard</a>
    </div>
</div>
</body>
</html>
